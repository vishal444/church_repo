<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Parish Admin — St. Ann Roman Catholic Church</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .admin-wrap {
      max-width: 780px;
      margin: 48px auto;
      padding: 0 24px 64px;
    }
    .admin-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 4px solid var(--gold);
      border-radius: var(--radius-md);
      padding: 28px;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
    }
    .admin-field {
      margin-bottom: 16px;
    }
    .admin-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--navy-deep);
      margin-bottom: 6px;
    }
    .admin-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      border-top: 1px solid var(--border);
    }
    .admin-row:first-child {
      border-top: none;
      padding-top: 4px;
    }
    .admin-status {
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--navy);
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header__inner">
      <a href="/" class="brand">
        <span class="brand__text">
          <span class="brand__name">St. Bobby's Cathedral</span>
          <span class="brand__sub">Parish Content Admin</span>
        </span>
      </a>
      <div class="header__actions">
        <a href="/" class="btn btn--outline-gold btn--sm">← Back to Public Site</a>
      </div>
    </div>
  </header>

  <main class="admin-wrap">
    <span class="eyebrow">Protected Editor</span>
    <h1 class="section-heading" style="font-size:2.3rem;">Parish Notices &amp; Updates</h1>
    <p class="section-lead" style="margin-bottom:24px;">
      Add or remove announcements, special Mass notices, or community updates. Changes appear immediately on the public site.
    </p>

    <section class="admin-card">
      <div class="admin-field">
        <label class="admin-label" for="token">Admin Token</label>
        <input id="token" type="password" class="input-light" placeholder="Enter ADMIN_TOKEN" autocomplete="off" />
      </div>

      <hr style="border:none; border-top:1px solid var(--border); margin:20px 0;" />

      <div class="admin-field">
        <label class="admin-label" for="title">Title</label>
        <input id="title" type="text" class="input-light" placeholder="e.g. Advent Choir Rehearsal Schedule" maxlength="200" />
      </div>

      <div class="admin-field">
        <label class="admin-label" for="details">Details</label>
        <textarea id="details" class="input-light" placeholder="Write the full notice or event details..." rows="5" maxlength="5000"></textarea>
      </div>

      <button id="add" type="button" class="btn btn--navy">Add entry</button>
      <p id="msg" class="admin-status" role="status" aria-live="polite"></p>
    </section>

    <section class="admin-card">
      <h2 class="schedule-panel__title" style="margin-bottom:14px;">Published Entries</h2>
      <div id="list">Loading…</div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const headers = () => ({
      "Content-Type": "application/json",
      Authorization: "Bearer " + $("token").value,
    });

    async function refresh() {
      const list = $("list");
      try {
        const res = await fetch("/api/entries");
        if (!res.ok) {
          list.textContent = "Could not load entries (" + res.status + ").";
          return;
        }
        const items = await res.json();
        list.textContent = "";
        if (!items.length) {
          list.textContent = "No published entries yet.";
          return;
        }

        for (const item of items) {
          const row = document.createElement("div");
          row.className = "admin-row";

          const info = document.createElement("div");
          const heading = document.createElement("strong");
          heading.textContent = item.title;
          const body = document.createElement("p");
          body.style.margin = "4px 0 0";
          body.style.fontSize = "0.9rem";
          body.style.color = "var(--ink-muted)";
          body.textContent = item.details;
          info.append(heading, body);

          const del = document.createElement("button");
          del.type = "button";
          del.className = "btn btn--outline-dark btn--sm";
          del.textContent = "Delete";
          del.onclick = async () => {
            const r = await fetch("/api/entries?id=" + encodeURIComponent(item.id), {
              method: "DELETE",
              headers: headers(),
            });
            $("msg").textContent = r.ok ? "Deleted." : "Failed: " + r.status;
            await refresh();
          };

          row.append(info, del);
          list.append(row);
        }
      } catch {
        list.textContent = "API unavailable. Run `netlify dev` locally or deploy to Netlify.";
      }
    }

    $("add").onclick = async () => {
      const r = await fetch("/api/entries", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({
          title: $("title").value,
          details: $("details").value,
        }),
      });
      $("msg").textContent = r.ok ? "Saved." : "Failed: " + r.status;
      if (r.ok) {
        $("title").value = "";
        $("details").value = "";
        await refresh();
      }
    };

    refresh();
  </script>
</body>
</html>
